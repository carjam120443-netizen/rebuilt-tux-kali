# RebuiltTux Kali boot menu configuration
# Kali-style menu structure is retained for development; artwork remains temporary.
set timeout=5
set default=0

menuentry 'RebuiltTux Kali 1.1 - Install' {
    linux /install/vmlinuz --- quiet
    initrd /install/initrd.gz
}

menuentry 'RebuiltTux Kali 1.1 - Advanced installer' {
    linux /install/vmlinuz ---
    initrd /install/initrd.gz
}

menuentry 'RebuiltTux Kali 1.1 - Help' {
    echo 'RebuiltTux Kali network installer'
    echo 'Use the normal installer entry to begin installation.'
}
