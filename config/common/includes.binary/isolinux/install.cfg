# RebuiltTux Kali installer boot entries
# Uses the standard Debian Installer layout expected by the netinstaller.
label install
    menu label ^Install RebuiltTux Kali 1.1
    linux /install/vmlinuz
    initrd /install/initrd.gz
    append vga=788 --- quiet

label expert
    menu label ^Expert install
    linux /install/vmlinuz
    initrd /install/initrd.gz
    append vga=788 ---
