name: Build RebuiltTux Kali Netinstaller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'pkg/**'
      - '.github/workflows/build-netinstaller.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out RebuiltTux repository
        uses: actions/checkout@v4

      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates gnupg2 gpg-agent pinentry-curses \
            build-essential devscripts dpkg-dev \
            debhelper fakeroot quilt \
            xorriso grub-pc-bin grub-efi-amd64-bin \
            grub-efi-amd64-signed shim-signed mtools simple-cdd

      - name: Install current Kali archive keyring
        run: |
          curl -fsSL -o /tmp/kali-archive-keyring.deb \
            https://http.kali.org/kali/pool/main/k/kali-archive-keyring/kali-archive-keyring_2025.2_all.deb
          sudo dpkg -i /tmp/kali-archive-keyring.deb
          test -s /usr/share/keyrings/kali-archive-keyring.gpg
          sudo gpg --batch --no-default-keyring --keyring /usr/share/keyrings/kali-archive-keyring.gpg --list-keys

      - name: Prepare isolated GPG environment
        run: |
          sudo rm -rf /root/.gnupg
          sudo install -d -m 700 /root/.gnupg
          sudo install -d -m 700 /run/user/0
          sudo tee /root/.gnupg/gpg-agent.conf >/dev/null <<'EOF'
          allow-loopback-pinentry
          use-standard-socket
          default-cache-ttl 300
          max-cache-ttl 600
          EOF
          sudo chown -R root:root /root/.gnupg
          sudo chmod 700 /root/.gnupg
          sudo gpgconf --kill gpg-agent || true
          sudo -H env GNUPGHOME=/root/.gnupg XDG_RUNTIME_DIR=/run/user/0 gpg-agent --daemon --homedir /root/.gnupg --allow-loopback-pinentry >/tmp/gpg-agent.log 2>&1 || true
          sudo -H env GNUPGHOME=/root/.gnupg XDG_RUNTIME_DIR=/run/user/0 gpgconf --launch gpg-agent
          sudo -H env GNUPGHOME=/root/.gnupg XDG_RUNTIME_DIR=/run/user/0 gpg-connect-agent /bye

      - name: Build and install Kali debian-cd package
        run: |
          git clone --depth 1 https://gitlab.com/kalilinux/packages/debian-cd.git kali-debian-cd
          cd kali-debian-cd
          if [ -f debian/changelog ]; then
            head -n 5 debian/changelog
          fi
          dpkg-buildpackage -us -uc -b
          cd ..
          DEB=$(find . -maxdepth 1 -type f -name 'debian-cd_*.deb' -print -quit)
          test -n "$DEB"
          sudo dpkg -i "$DEB"
          sudo apt-get -f install -y

      - name: Disable Jigdo generation for netinstaller builds
        run: |
          # Ubuntu's xorriso package is built without libjte. Kali's
          # debian-cd configuration normally asks xorriso for Jigdo output,
          # which causes: "Jigdo Template Extraction was not enabled at
          # compile time". A netinstaller only needs the ISO, so disable
          # Jigdo generation rather than rebuilding xorriso with libjte.
          sudo tee -a /etc/debian-cd/conf.sh >/dev/null <<'EOF'
          
          # RebuiltTux CI: netinstaller builds do not need Jigdo files.
          export MAXJIGDOS=0
          EOF

          echo 'Effective debian-cd Jigdo configuration:'
          sudo grep -nE 'MAXISOS|MAXJIGDOS|JIGDO_OPTS' /etc/debian-cd/conf.sh || true

      - name: Verify Kali debian-cd version
        run: |
          dpkg-query -W -f='debian-cd=${Version}\n' debian-cd
          VERSION=$(dpkg-query -W -f='${Version}' debian-cd)
          dpkg --compare-versions "$VERSION" ge "3.2.1+kali1"

      - name: Clone official Kali installer build scripts
        run: |
          git clone --depth 1 https://gitlab.com/kalilinux/build-scripts/kali-installer.git kali-installer

      - name: Configure RebuiltTux netinstaller build
        working-directory: kali-installer
        run: |
          echo 'https://kali.download/kali' > .mirror

          mkdir -p simple-cdd/profiles/rebuilttux

          cat > simple-cdd/profiles/rebuilttux.packages <<'EOF'
          apt
          ca-certificates
          sudo
          EOF

          mkdir -p simple-cdd/local_packages/rebuilttux/pkg
          cp ../config/includes.chroot/usr/bin/pkg simple-cdd/local_packages/rebuilttux/pkg/pkg
          cp ../config/includes.chroot/usr/share/doc/rebuilttux-kali/pkg/README.md simple-cdd/local_packages/rebuilttux/pkg/README.md

          touch simple-cdd/profiles/kali.profiles
          if ! grep -qx 'rebuilttux' simple-cdd/profiles/kali.profiles; then
            printf 'rebuilttux\n' >> simple-cdd/profiles/kali.profiles
          fi

      - name: Build Kali netinstaller
        working-directory: kali-installer
        run: |
          set -o pipefail

          for attempt in 1 2 3 4 5; do
            echo "=== RebuiltTux Kali netinstaller build attempt $attempt/5 ==="

            # build.sh runs as root and can leave simple-cdd/debian-cd owned by
            # root. Clean it with sudo so a failed mirror-sync attempt can be
            # retried without Permission denied errors.
            sudo rm -rf simple-cdd/tmp simple-cdd/debian-cd

            # Also repair ownership of the generated working tree after a
            # failed attempt. This keeps diagnostics and subsequent cleanup
            # accessible to the GitHub Actions runner.
            sudo chown -R "$(id -u):$(id -g)" simple-cdd 2>/dev/null || true
            sudo rm -rf simple-cdd/tmp simple-cdd/debian-cd

            if sudo -H env \
              GNUPGHOME=/root/.gnupg \
              XDG_RUNTIME_DIR=/run/user/0 \
              GPG_TTY=/dev/null \
              MAXJIGDOS=0 \
              ./build.sh --arch amd64 --variant netinst --verbose 2>&1 | tee ../build.log; then
              echo "Kali netinstaller build succeeded on attempt $attempt"
              exit 0
            fi

            echo "Build attempt $attempt failed; retrying after a clean mirror cache."
            if [ "$attempt" -lt 5 ]; then
              sleep 15
            fi
          done

          echo "All Kali netinstaller build attempts failed."
          exit 1

      - name: Locate generated ISO
        run: |
          ISO=$(find kali-installer/images -maxdepth 3 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          cp "$ISO" RebuiltTux-Kali-1.1-amd64-netinst.iso

      - name: Generate checksum
        run: sha256sum RebuiltTux-Kali-1.1-amd64-netinst.iso > RebuiltTux-Kali-1.1-amd64-netinst.iso.sha256

      - name: Upload ISO and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltTux-Kali-1.1-amd64-netinst-build
          path: |
            RebuiltTux-Kali-1.1-amd64-netinst.iso
            RebuiltTux-Kali-1.1-amd64-netinst.iso.sha256
            build.log
          retention-days: 14
