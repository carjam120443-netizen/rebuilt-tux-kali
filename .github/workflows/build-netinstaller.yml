name: Build RebuiltTux Kali Netinstaller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'pkg/**'
      - '.github/workflows/build-netinstaller.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out RebuiltTux repository
        uses: actions/checkout@v4

      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            curl \
            ca-certificates \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            mtools \
            simple-cdd

      - name: Obtain Kali debian-cd and installer dependencies
        run: |
          git clone --depth 1 https://gitlab.com/kalilinux/packages/debian-cd.git kali-debian-cd
          cd kali-debian-cd
          sudo make install
          cd ..
          if dpkg --compare-versions "$(dpkg-query -W -f='${Version}' debian-cd 2>/dev/null || echo 0)" lt "3.2.1+kali1"; then
            echo "Installed debian-cd is too old: $(dpkg-query -W -f='${Version}' debian-cd 2>/dev/null || echo missing)"
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends debian-cd

      - name: Clone official Kali installer build scripts
        run: |
          git clone --depth 1 https://gitlab.com/kalilinux/build-scripts/kali-installer.git kali-installer

      - name: Verify Kali debian-cd version
        run: |
          dpkg-query -W -f='debian-cd=${Version}\n' debian-cd
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' debian-cd)" ge "3.2.1+kali1"

      - name: Configure RebuiltTux netinstaller build
        working-directory: kali-installer
        run: |
          echo 'http://http.kali.org/kali' > .mirror

          mkdir -p simple-cdd/profiles/rebuilttux

          cat > simple-cdd/profiles/rebuilttux.packages <<'EOF'
          apt
          ca-certificates
          sudo
          EOF

          cat > simple-cdd/profiles/rebuilttux.postinst <<'EOF'
          #!/bin/sh
          set -e

          install -d -m 0755 /usr/share/doc/rebuilttux-kali/pkg

          if [ -f /cdrom/rebuilttux/pkg/README.md ]; then
            install -m 0644 /cdrom/rebuilttux/pkg/README.md /usr/share/doc/rebuilttux-kali/pkg/README.md
          fi

          if [ -f /cdrom/rebuilttux/pkg/pkg ]; then
            install -m 0755 /cdrom/rebuilttux/pkg/pkg /usr/bin/pkg
          fi
          EOF
          chmod +x simple-cdd/profiles/rebuilttux.postinst

          mkdir -p simple-cdd/local_packages/rebuilttux/pkg
          cp ../config/includes.chroot/usr/bin/pkg simple-cdd/local_packages/rebuilttux/pkg/pkg
          cp ../config/includes.chroot/usr/share/doc/rebuilttux-kali/pkg/README.md simple-cdd/local_packages/rebuilttux/pkg/README.md

          if ! grep -qx 'rebuilttux' simple-cdd/profiles/kali.profiles; then
            printf 'rebuilttux\n' >> simple-cdd/profiles/kali.profiles
          fi

      - name: Build Kali netinstaller
        working-directory: kali-installer
        run: |
          sudo ./build.sh --arch amd64 --variant netinst --verbose 2>&1 | tee ../build.log

      - name: Locate generated ISO
        run: |
          ISO=$(find kali-installer/images -maxdepth 3 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          cp "$ISO" RebuiltTux-Kali-1.1-amd64-netinst.iso

      - name: Generate checksum
        run: sha256sum RebuiltTux-Kali-1.1-amd64-netinst.iso > RebuiltTux-Kali-1.1-amd64-netinst.iso.sha256

      - name: Upload ISO and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltTux-Kali-1.1-amd64-netinst-build
          path: |
            RebuiltTux-Kali-1.1-amd64-netinst.iso
            RebuiltTux-Kali-1.1-amd64-netinst.iso.sha256
            build.log
          retention-days: 14
