name: Build RebuiltTux Kali Netinstaller

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'pkg/**'
      - '.github/workflows/build-netinstaller.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install live-build and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-amd64-signed \
            shim-signed \
            mtools \
            dosfstools

      - name: Prepare live-build configuration
        run: |
          mkdir -p build
          cd build
          sudo lb config \
            --mode debian \
            --distribution kali-rolling \
            --architectures amd64 \
            --archive-areas 'main contrib non-free non-free-firmware' \
            --mirror-bootstrap 'http://http.kali.org/kali' \
            --mirror-chroot 'http://http.kali.org/kali' \
            --mirror-binary 'http://http.kali.org/kali' \
            --apt-indices false \
            --binary-images iso-hybrid \
            --bootappend-live 'boot=live components'
          sudo chown -R "$USER":"$USER" config

      - name: Configure minimal package set
        run: |
          mkdir -p build/config/package-lists
          cat > build/config/package-lists/rebuilt-tux-kali.list.chroot <<'EOF'
          apt
          ca-certificates
          init-system-helpers
          live-boot
          linux-image-amd64
          openssh-client
          sudo
          EOF

      - name: Copy custom configuration without overwriting live-build config
        run: |
          if [ -d config/includes.chroot ]; then
            mkdir -p build/config/includes.chroot
            cp -a config/includes.chroot/. build/config/includes.chroot/
          fi
          if [ -d config/package-lists ]; then
            mkdir -p build/config/package-lists
            cp -a config/package-lists/. build/config/package-lists/
          fi
          if [ -d config/hooks ]; then
            mkdir -p build/config/hooks
            cp -a config/hooks/. build/config/hooks/
          fi
          if [ -d config/binary ]; then
            mkdir -p build/config/binary
            cp -a config/binary/. build/config/binary/
          fi
          if [ -d config/installer ]; then
            mkdir -p build/config/installer
            cp -a config/installer/. build/config/installer/
          fi

      - name: Install RebuiltTux pkg scaffold
        run: |
          mkdir -p build/config/includes.chroot/usr/bin
          mkdir -p build/config/includes.chroot/usr/share/doc/rebuilttux-kali/pkg
          cp config/includes.chroot/usr/bin/pkg build/config/includes.chroot/usr/bin/pkg
          cp config/includes.chroot/usr/share/doc/rebuilttux-kali/pkg/README.md build/config/includes.chroot/usr/share/doc/rebuilttux-kali/pkg/README.md
          chmod +x build/config/includes.chroot/usr/bin/pkg

      - name: Build ISO
        working-directory: build
        run: |
          sudo lb build 2>&1 | tee ../build.log

      - name: Fix generated file ownership
        if: always()
        run: sudo chown -R "$USER":"$USER" build || true

      - name: Rename ISO
        run: |
          ISO=$(find build -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO"
          cp "$ISO" RebuiltTux-Kali-1.1-amd64.iso

      - name: Generate checksum
        run: sha256sum RebuiltTux-Kali-1.1-amd64.iso > RebuiltTux-Kali-1.1-amd64.iso.sha256

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltTux-Kali-1.1-build-logs
          path: build.log
          retention-days: 14
